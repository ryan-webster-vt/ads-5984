# Optional stdlib `logging.config.dictConfig` configuration.
#
# The application configures logging programmatically in
# `upset_profiler.logging_config` so that it can inject secret redaction.
# This file documents an equivalent console configuration and can be loaded
# directly by tools that expect dictConfig input.

version: 1
disable_existing_loggers: false

formatters:
  console:
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [console]

loggers:
  httpx:
    level: WARNING
  httpcore:
    level: WARNING
  urllib3:
    level: WARNING
