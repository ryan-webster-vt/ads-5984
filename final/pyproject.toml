[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upset-profiler"
version = "0.1.0"
description = "NCAA Division I Men's Basketball Upset Condition Profiler (multi-agent system)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Ryan Webster" }]
keywords = ["college-basketball", "multi-agent", "upset-profiler", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2"]
stats = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
]
rag = ["chromadb>=0.5,<2", "openai>=1.30,<2"]
mcp = ["mcp>=1.0,<2"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=0.23,<1",
    "pytest-timeout>=2.2,<3",
    "respx>=0.21,<1",
    "freezegun>=1.5,<2",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
upset-profiler = "upset_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upset_profiler = ["py.typed", "storage/schema.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that exercise multiple modules with real local resources",
    "e2e: end-to-end pipeline tests using fixtures",
    "slow: long-running tests",
    "evaluation: statistical and backtesting evaluation tests",
]

[tool.coverage.run]
branch = true
source = ["upset_profiler"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["upset_profiler"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["upset_profiler"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
